name: Run UK CoS Job Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Europe/London"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore seen-job state
        uses: actions/cache/restore@v4
        with:
          path: .cos_state
          key: cos-seen-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cos-seen-${{ runner.os }}-
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile and self-test
        run: |
          python -m py_compile cos_hunter.py send_email.py
          python cos_hunter.py --self-test
      - name: Hunt and verify sponsorship jobs
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          COS_MAX_CANDIDATES: "160"
          COS_STATE_DIR: ".cos_state"
        run: python cos_hunter.py
      - name: Validate outputs
        run: |
          test -f cos_results.csv
          test -f cos_new_results.csv
          test -f cos_source_audit.csv
      - name: Save seen-job state
        uses: actions/cache/save@v4
        with:
          path: .cos_state
          key: cos-seen-${{ runner.os }}-${{ github.run_id }}
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: uk-cos-job-results
          path: |
            cos_results.csv
            cos_new_results.csv
            cos_source_audit.csv
            .cos_state/seen_jobs.json
          retention-days: 14
      - name: Email NEW verified jobs
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          COS_EMAIL_RESULTS_FILE: "cos_new_results.csv"
        run: python send_email.py
